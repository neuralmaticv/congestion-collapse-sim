[package]
name = "congestion-collapse-sim"
version = "0.1.0"
edition = "2024"
description = "A discrete-time queueing system simulator for modeling request processing, timeouts, and congestion collapse in synchronous request/reply systems"
authors = ["Vladimir Mijic"]
license = "MIT"
repository = "https://github.com/neuralmaticv/congestion-collapse-sim"

[dependencies]
rand = "0.9.2"
rand_distr = "0.5.1"
clap = { version = "4.5", features = ["derive"] }
